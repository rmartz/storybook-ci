# @rmartz/repo-hygiene check configuration for this repo.
# Consumed through the reusable-workflow caller (.github/workflows/repo-hygiene.yml),
# which names the checks below and points them at this config.
#
# docs/ is an OKF bundle — see docs/okf-format.md.
checks:
  # Intra-repo Markdown link integrity for docs pages.
  docs-links:
    roots: [docs]
    exempt: []
  # Every AGENTS.md has a companion CLAUDE.md (a bare `@AGENTS.md` import) and
  # vice versa.
  md-pairing:
    wrapper: true
  # OKF docs-frontmatter conformance. The doc pages here are concept/guide pages
  # (`Reference`) plus recorded design decisions (`Design`) — both resource-exempt.
  okf:
    types: [Skill, Script, Library, Design, Reference]
    resourceExemptTypes: [Design, Reference]
    exempt: [docs/index.md]
  # Per-glob size caps, dogfooded against our own source and docs.
  file-caps:
    overrides:
      - glob: 'src/**/*.ts'
        lines: { warn: 350, error: 500 }
        bytes: { warn: 16KB, error: 24KB }
      - glob: 'docs/**/*.md'
        lines: { warn: 500, error: 700 }
        bytes: { warn: 32KB, error: 48KB }
