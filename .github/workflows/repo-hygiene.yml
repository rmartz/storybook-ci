name: Repo Hygiene

# This repo consumes @rmartz/repo-hygiene through the exact reusable-workflow
# caller every consuming repo uses. It pins repo-hygiene's published reusable
# workflow by SHA (Dependabot bumps it via the github-actions ecosystem) and runs
# our chosen check set against our own tree through the published
# @rmartz/repo-hygiene package.
#
# We name the checks explicitly (rather than take the default-on set) so OKF docs
# conformance, docs-link integrity, AGENTS/CLAUDE pairing, and file-size caps are
# all gated here, configured via .repo-hygiene.yml.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hygiene:
    permissions:
      contents: read
      packages: read
    uses: rmartz/repo-hygiene/.github/workflows/hygiene.yml@87cea59efa41c587fad3a3a4e6f17c9b70e44713 # v5.0.0
    with:
      checks: conflict-markers action-pins package-pins docs-links md-pairing okf okf-index file-caps
      config: .repo-hygiene.yml
