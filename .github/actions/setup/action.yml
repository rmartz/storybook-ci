name: 'Setup'
description: "Install pnpm, Node.js, and this repo's dependencies (with optional Playwright browser caching)"

inputs:
  frozen-lockfile:
    description: 'Use --frozen-lockfile for pnpm install'
    required: false
    default: 'true'
  playwright:
    description: >-
      Space-separated Playwright browsers to install (e.g. "chromium"). When set,
      the browser binaries are cached at ~/.cache/ms-playwright and restored across
      runs and jobs, so only a cache miss pays the download. Leave empty (default)
      for jobs that need no browser. This is the canonical FR-1 Chromium
      provisioning; the reusable workflows inline the equivalent logic because a
      reusable workflow cannot reference a `./`-local action across the workflow
      boundary.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x
        cache: 'pnpm'
    - run: pnpm install ${{ inputs.frozen-lockfile == 'true' && '--frozen-lockfile' || '--no-frozen-lockfile' }}
      shell: bash

    # Cache the Playwright browser binaries so the ~130MB Chromium download is paid
    # once and shared across jobs (the Actions cache is repo-global). Keyed on the
    # lockfile so a Playwright version bump busts it; the prefix restore-key still
    # restores the previous browsers on a partial hit.
    - name: Cache Playwright browsers
      if: inputs.playwright != ''
      id: playwright-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ inputs.playwright }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          playwright-${{ runner.os }}-${{ inputs.playwright }}-

    - name: Install Playwright browsers
      if: inputs.playwright != ''
      shell: bash
      env:
        PLAYWRIGHT_BROWSERS: ${{ inputs.playwright }}
      # Browser binaries only — no apt. The ubuntu-latest image already ships the
      # libraries Chromium needs, and a slow apt mirror stalls rather than fails,
      # so `--with-deps` could hang past the job timeout (#90). On a cache hit this
      # downloads nothing. Retry: the browser download hits transient CDN failures.
      run: |
        install_cmd="pnpm exec playwright install $PLAYWRIGHT_BROWSERS"
        for i in 1 2 3; do
          if $install_cmd; then
            exit 0
          fi
          echo "playwright install failed (attempt $i/3) — retrying in 5s"
          sleep 5
        done
        exit 1
